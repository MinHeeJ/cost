x-basic-87-implementation-review: '## BASIC-87 구현 인계 정리 — 2026-10-13


  이 절은 BASIC-87의 현재 구현 인계 기준이며, 아래에 남아 있는 생성 단계의 OQ-001~010·OQ-UI-*·OQ-DATA-*·P-OQ-001 보류/승인 필요 문구보다 우선한다. 명세 정리는 사용자 위임 범위에서
  수행했고 품질 수용·HITL 승인·코드 생성은 실행하지 않았다. 제품 시험은 실제 구현 후 수행한다.


  - 범위: 원문 기반-1의 앱 틀·토큰·format/input 순수 함수·공통 부품·31개 업무 자리만 구현한다. API는 GET /api/menus, /api/month-close, /api/health 3개, DB는
  sys_menu/fin_month_close 2개뿐이다. 원가 업무·로그인·권한·AI·엑셀·인쇄·다크모드·업무 CRUD를 추가하지 않는다.

  - OQ-001: 현재 접수 intake_context와 실행 seed/plan.md 정본의 imperative/mybatis/blocking을 유지한다. 원문의 Spring Data JPA 표기는 접수 설정과 충돌하는
  역사적 원문으로 남기되 현재 구현은 MyBatis starter+mapper XML, Spring MVC 동기 읽기, Java17/Spring Boot3.3.x/Flyway/PostgreSQL16이다. JPA를 같이
  넣거나 WebFlux·worker·202/polling으로 바꾸지 않는다. 사용자가 다른 구성을 선택하면 실행 정본을 함께 갱신한다.

  - OQ-002: 탭 사이 전환은 입력과 컴포넌트 상태를 보존하므로 확인 창 없이 이동한다. 입력이 실제로 사라지는 닫기·9번째 탭 교체는 확인하고 [계속 작성]이면 입력·탭 불변, [나가기]일 때만 제거한다. 고정
  대시보드는 LRU 제거 후보에서 제외한다. 새로고침/창 닫기는 dirty일 때 beforeunload. 입력 유지와 이탈 확인을 모두 만족하는 해석이다.

  - OQ-003/006: operationId는 getMenus/getMonthClose/getHealth, route/테이블/화면 UI-* ID는 원문 그대로다. SCR-*는 문서 추적 별칭이며 DB screen_id로
  저장하지 않는다. BOM major/minor 범위 안에서 구현 시 호환 버전을 lockfile/pom에 고정하고 CI/build로 검증한다. 패키지 patch·localStorage 하위 키·컴포넌트 명명은 구현
  선택이며 별도 제품 승인 blocker가 아니다.

  - OQ-004: format.ts는 실제 원가 업무 계산이 아닌 표시 순수 함수다. 원/천원/백만원은 1/1000/1000000으로 환산하고 정수 표시, 반올림은 절댓값 half-up 후 부호 복원(−0은0). 억(>=100000000)은
  소수1자리, 만(>=10000)은 정수로 축약하고 부호·단위 규칙을 적용한다. MM=소수2자리, 전달된 퍼센트 값=소수1자리+%, 차이=%p; 비율의 업무 계산이나 ×100 변환을 format 함수에 숨기지 않는다.
  원문의 −1320000→−1,320,000/천원−1,320, 12.4억원, 3820만원을 단위 시험한다. 시간대 있는 값은 Asia/Seoul로, 날짜/연월 문자열은 달력 값 그대로 표시한다. 계산 readonly
  견본의 수식은 UI 예시임을 명시하고 실제 원가 업무 수식으로 확장하지 않는다.

