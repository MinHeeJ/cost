paths:
  /api/menus:
    get:
      security: []
      x-contract-status: implementation_ready_for_review
      x-operation-id-status: implementation_name_fixed
      summary: 사용 메뉴 트리 조회
      description: 'REQ-081: use_yn=Y인 묶음/화면을 sort_order 순으로 반환한다. 인증이 없고 PC 전용 화면도 서버 트리에 포함하며 frontend가 휴대폰에서 제외한다. 41행
        seed를 현재 기반으로 하며 업무 목록 API나 메뉴 관리 API를 추가하지 않는다.'
      x-related-requirements:
      - REQ-081
      - REQ-002
      - REQ-059
      - REQ-060
      - REQ-062
      x-pagination:
        enabled: false
        reason: 현재 기반의 묶음10행·화면31행 전체 2단 메뉴 트리이며 화면 탐색은 전체 트리를 소비한다. 페이지 분할은 부모/자식 구조를 깨므로 업무 목록 page/size 표준을 적용하지 않는다.
      x-business-rules:
      - 'REQ-081: sys_menu.use_yn=Y인 메뉴만 반환하며 sort_order 순서를 유지한다.'
      - 'REQ-002: 로그인·권한 요구 없이 모든 호출자에게 읽기를 제공한다.'
      - 'REQ-066/REQ-044: mobile_yn=N은 기기 지원 표시다. 서버 트리에서 제거하거나 인증 거부로 처리하지 않는다.'
      x-side-effects:
      - 'REQ-081/REQ-052: 읽기만 하며 sys_menu 행과 updated_at·updated_by를 변경하지 않는다.'
      x-required-tests:
      - 'happy: 원문 묶음10행·화면31행의 활성 seed로 GET /api/menus 요청 -> 묶음 아래 화면31개가 sort_order 순의 트리로 조회된다.'
      - 'auth: 인증 정보 없이 GET /api/menus 요청 -> 로그인 요구 없이 HTTP 200과 메뉴 트리가 반환된다.'
      - 'business: 테스트에 sys_menu.use_yn=N 행을 추가한 뒤 조회 -> 그 행이 응답 트리에 없고 해당 저장 행의 use_yn은 N 그대로다.'
      - 'state: UI-14의 mobile_yn=N인 seed로 메뉴 조회 -> 서버 결과에는 UI-14와 mobile_yn=N이 있고 모바일 UI가 이를 제외할 근거를 얻는다.'
      - 'side-effect: sys_menu 전 행과 updated_at을 snapshot한 뒤 GET /api/menus 요청 -> DB 행·updated_at이 snapshot과 동일하다.'
      - 'response: 메뉴 정상 응답과 서버 실패 응답을 각각 발생 -> 두 응답 모두 X-Request-Id가 있고 실패 본문에는 code/message/requestId가 있다.'
      x-open-questions: []
      responses:
        '200':
          description: 활성 메뉴 트리. MenusResponse는 원문 결과의 제안 투영이며 OQ-007 승인 전 구현 정본이 아니다.
          headers:
            X-Request-Id:
              description: 모든 서버 응답의 requestId, 오류 본문 requestId와 같다. UUID 문자열.
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/MenusResponse'
        '404':
          description: 'REQ-062: 없는 대상 또는 미등록 API 경계. 메뉴가 빈 트리이거나 저장 월이 없다는 이유로 404를 반환하지 않는다.'
          headers:
            X-Request-Id:
              description: 모든 서버 응답의 requestId, 오류 본문 requestId와 같다. UUID 문자열.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: 'REQ-062: 서버 오류. requestId를 문의에 사용하며 원문 오류 필드와 공통 envelope 결합은 OQ-007이다.'
          headers:
            X-Request-Id:
              description: 모든 서버 응답의 requestId, 오류 본문 requestId와 같다. UUID 문자열.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      operationId: getMenus
  /api/month-close:
