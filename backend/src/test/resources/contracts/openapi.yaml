components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Flag:
      type: string
      enum:
      - Y
      - N
      description: use_yn·mobile_yn의 승인 공통 값. use_yn은 사용 여부, mobile_yn은 휴대폰 지원 여부다.
      x-related-requirements:
      - REQ-053
      - REQ-055
      - REQ-066
    MonthCloseStatus:
      type: string
      enum:
      - OPEN
      - CLOSED
      description: OPEN은 작업중, CLOSED는 마감. 행 없는 달은 응답에서 OPEN으로 해석하지만 저장하지 않는다.
      x-related-requirements:
      - REQ-056
      - REQ-082
    YearMonth:
      type: string
      pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
      description: YYYY-MM 표현. 실제 유효월·연도 경계·역순·최대 조회범위의 검증 결과는 OQ-005 확인 필요. 이 표현 pattern만으로 오류 정책 승인을 대신하지 않는다.
    ApiResponse:
      type: object
      required:
      - success
      - meta
      properties:
        success:
          type: boolean
          const: true
        meta:
          type: object
          description: 공통 metadata 객체는 필수. 내부 항목은 요청에서 미정이며 임의 pagination/requestId 필드를 추가하지 않는다.
      description: 성공 공통 envelope. operation이 결과를 약속한 경우 allOf로 data를 필수로 추가한다. OQ-007의 원문 성공 wire 결합은 승인 전 제안이다.
    ApiError:
      type: object
      required:
      - success
      - meta
      - code
      - message
      - field
      - requestId
      properties:
        success:
          type: boolean
          const: false
        meta:
          type: object
          description: 실패 metadata 객체는 필수. 내부 항목은 미정.
        code:
          type: string
          description: 오류 코드. 원문 code 명칭을 보존하며 코드 목록·정확 값은 미정.
        message:
          type: string
          description: 오류 설명. 확정된 오류 문구 목록은 없다.
        field:
          type:
          - string
          - 'null'
          description: 400입력오류필드명,비입력오류null
        requestId:
          type: string
          description: 문의 번호. X-Request-Id와 같은 요청을 식별한다. 생성·전파 형식은 미정.
      description: 공통오류envelope와원문code/message/field/requestId를최상위에서한번만결합
      x-contract-status: implementation_ready_for_review
      x-open-questions: []
    MenuNode:
      type: object
      required:
      - menu_id
      - menu_name
      - screen_id
      - sort_order
      - mobile_yn
      - children
      properties:
        menu_id:
          type: string
          pattern: ^[0-9]+$
          description: DB BIGINT menu_id의십진문자열
        parent_menu_id:
          type:
          - string
          - 'null'
          pattern: ^[0-9]+$
          description: 그룹null/leaf부모menu_id십진문자열
        menu_name:
          type: string
          maxLength: 50
          description: sys_menu.menu_name; 화면/묶음 이름.
        screen_id:
          type:
          - string
          - 'null'
          maxLength: 10
          description: sys_menu.screen_id; 묶음은 NULL.
        icon:
          type:
          - string
          - 'null'
          maxLength: 30
          description: sys_menu.icon; 문자열을 lucide-react로 매핑하는 세부는 OQ-006.
