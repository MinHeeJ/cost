      security: []
      x-contract-status: implementation_ready_for_review
      x-operation-id-status: implementation_name_fixed
      summary: 기간별 월 마감 상태 조회
      description: 'REQ-082: from/to의 YYYY-MM 범위 상태를 읽는다. 행 없는 달은 OPEN으로 해석하지만 fin_month_close에 insert하지 않는다. CLOSED/OPEN
        모두 조회 허용이며 월 마감·재개 command가 아니다.'
      x-related-requirements:
      - REQ-082
      - REQ-002
      - REQ-059
      - REQ-060
      - REQ-062
      parameters:
      - name: from
        in: query
        required: true
        description: 양끝포함범위의시작YYYY-MM,누락/형식/역순400
        schema:
          $ref: '#/components/schemas/YearMonth'
      - name: to
        in: query
        required: true
        description: 양끝포함범위의종료YYYY-MM,누락/형식/역순400
        schema:
          $ref: '#/components/schemas/YearMonth'
      x-pagination:
        enabled: false
        reason: from/to로 지정한 하나의 유한 월 구간의 상태 결과다. 전체 상태 집합을 읽는 기간 줄 지원 조회로 페이지를 나누는 요구가 없다. 최대 범위·끝점 포함성은 OQ-005이며 이 선언은 무제한
          조회 승인이나 새 최대월수 정책이 아니다.
        x-contract-status: implementation_ready_for_review
        x-open-question: 'OQ-005: 최종 범위·페이징 정책 확인 전 page/size·최대월수 강제 금지'
      x-business-rules:
      - 'REQ-082: 요청 범위의 월 상태를 반환하고 저장 행이 없는 월은 응답에서 OPEN으로 처리한다.'
      - 'REQ-056/REQ-082: OPEN과 CLOSED 모두 읽을 수 있으며 조회가 마감·재개 상태를 변경하지 않는다.'
      - 'REQ-002: 로그인·역할 제한 없는 공개 읽기다. 역순·범위 한계·정확 오류는 OQ-005 해소 전 추측하지 않는다.'
      x-side-effects:
      - 'REQ-082: fin_month_close 행수·status·closed_at·재개 필드는 조회 전후 동일하며 없는 월을 생성하지 않는다.'
      x-required-tests:
      - 'happy: fin_month_close에 2026-09=CLOSED·2026-10=OPEN seed가 있는 상태에서 from=2026-09&to=2026-10 조회 -> 각 월의 CLOSED/OPEN
        상태가 응답에서 구분된다.'
      - 'auth: 인증 정보 없이 from=2026-09&to=2026-10 조회 -> 로그인 요구 없이 HTTP 200과 두 월 상태가 반환된다.'
      - 'business: 실제 저장 행이 없는 월을 단일월 from/to로 조회 -> 응답 상태 OPEN이고 후속 DB 조회에도 그 close_month 행이 없다.'
      - 'state: 저장 status=CLOSED인 2026-09를 조회 -> 응답은 CLOSED이며 후속 fin_month_close.status도 CLOSED로 유지된다.'
      - 'side-effect: 조회 전 fin_month_close의 행수·closed_at·reopened_at·reopen_reason을 snapshot한 뒤 범위 조회 -> 모든 값과 행수가 동일하다.'
      - 'response: from=2026-09&to=2026-10으로 월 상태 조회 -> 성공 응답에 X-Request-Id가 있고 OQ-007 승인 후 고정할 envelope 검증에서 success=true·meta·data의
        close_month/status를 읽을 수 있다.'
      x-open-questions: []
      responses:
        '200':
          description: 요청 월 상태. MonthCloseResponse는 명시된 월/상태의 제안 투영이며 DTO 승인이 필요하다.
          headers:
            X-Request-Id:
              description: 모든 서버 응답의 requestId, 오류 본문 requestId와 같다. UUID 문자열.
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/MonthCloseResponse'
        '400':
          description: 'REQ-062: 확정된 입력 오류에는 field를 포함한다. 월 역순·최대 범위·정확 코드/메시지는 OQ-005 승인 전 임의 거부 조건으로 추가하지 않는다.'
          headers:
            X-Request-Id:
              description: 모든 서버 응답의 requestId, 오류 본문 requestId와 같다. UUID 문자열.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 'REQ-062: 없는 대상 또는 미등록 API 경계. 메뉴가 빈 트리이거나 저장 월이 없다는 이유로 404를 반환하지 않는다.'
          headers:
            X-Request-Id:
              description: 모든 서버 응답의 requestId, 오류 본문 requestId와 같다. UUID 문자열.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: 'REQ-062: 서버 오류. requestId를 문의에 사용하며 원문 오류 필드와 공통 envelope 결합은 OQ-007이다.'
          headers:
            X-Request-Id:
              description: 모든 서버 응답의 requestId, 오류 본문 requestId와 같다. UUID 문자열.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      operationId: getMonthClose
