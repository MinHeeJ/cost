services:
  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-cost}
      POSTGRES_USER: ${DB_USER:-cost}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev-only-password}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    image: cost-backend:0.1.0
    build:
      context: ../backend
    pull_policy: build
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-cost}
      DB_USERNAME: ${DB_USER:-cost}
      DB_PASSWORD: ${DB_PASSWORD:-dev-only-password}
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080;
          printf 'GET /api/health HTTP/1.0\r\n\r\n' >&3;
          IFS= read -r line <&3;
          [[ "$$line" == HTTP/*" 200 "* ]]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
  frontend:
    image: cost-frontend:0.1.0
    build:
      context: ../frontend
    pull_policy: build
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy
volumes:
  database:
